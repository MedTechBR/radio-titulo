<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Visor — RadioTítulo</title>
<style>
:root{--bg:#0B0F14;--pan:#111823;--line:#1E2A3A;--ink:#E6EDF3;--mut:#8FA3B8;--brand:#3B82F6;--brand2:#60A5FA;--ok:#34D399;--err:#F87171;--warn:#FFB020}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 Inter,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.bar{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--pan);border-bottom:1px solid var(--line);flex-wrap:wrap;min-height:48px}
.bar .tit{font-weight:600;font-size:14px;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
.bt{display:inline-flex;align-items:center;gap:5px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;color:var(--mut);font-size:13px;min-height:38px}
.bt svg{width:17px;height:17px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.bt.on{color:#fff;background:var(--brand);border-color:var(--brand)}
.bt:active{transform:translateY(1px)}
select{font-size:16px;background:var(--pan);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:8px}
#stage{flex:1;position:relative;overflow:hidden;background:#000;touch-action:none;cursor:crosshair}
#stage.mover{cursor:grab}
#plate{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#plate img{display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
#anot{position:absolute;inset:0;pointer-events:none;display:none}
#anot.vis{display:block}
#hud{position:absolute;left:10px;bottom:10px;background:rgba(11,15,20,.82);border:1px solid var(--line);border-radius:9px;padding:5px 9px;font-size:12px;color:var(--mut);pointer-events:none}
#cron{position:absolute;right:10px;top:10px;background:rgba(11,15,20,.82);border:1px solid var(--line);border-radius:9px;padding:5px 10px;font-size:14px;font-variant-numeric:tabular-nums;color:var(--ink);display:none}
#info{background:var(--pan);border-top:1px solid var(--line);padding:10px 14px;font-size:14px;max-height:34vh;overflow:auto;overscroll-behavior:contain}
#info h3{font-size:15px;margin-bottom:4px}
#info .meta{color:var(--mut);font-size:12.5px;margin-bottom:6px}
#info .lic{color:var(--mut);font-size:11.5px;margin-top:8px;border-top:1px solid var(--line);padding-top:6px}
.chip{display:inline-block;padding:2px 8px;border:1px solid var(--line);border-radius:99px;font-size:11.5px;color:var(--mut);margin-right:4px}
.chip.b{color:var(--brand2);border-color:var(--brand)}
#galeria{flex:1;overflow:auto;padding:12px;-webkit-overflow-scrolling:touch}
#grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:var(--pan);border:1px solid var(--line);border-radius:11px;overflow:hidden;cursor:pointer;text-align:left}
.card img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#000}
.card .leg{padding:7px 9px;font-size:12px;color:var(--mut)}
.aviso{padding:14px;color:var(--mut);font-size:14px}
#treinoCfg{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center}
#treinoCfg h2{font-size:18px}
#treinoCfg p{color:var(--mut);max-width:420px;font-size:13.5px}
.btg{background:var(--brand);color:#fff;border:none;padding:12px 22px;border-radius:11px;font-size:15px;font-weight:600}
.linhaCfg{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#notaBox{display:none;gap:8px;align-items:center;padding:10px 14px;background:var(--pan);border-top:1px solid var(--line);flex-wrap:wrap}
#notaBox .btg{padding:10px 16px;font-size:14px}
#notaBox .err{background:var(--err)}
#notaBox .ok{background:var(--ok);color:#06281c}
.oculto{display:none!important}
</style>
</head>
<body>
<div class="bar" id="barra">
  <button class="bt" id="btVoltar" title="Voltar"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
  <span class="tit" id="titulo">Casos</span>
  <select id="fMod" class="oculto"><option value="">Modalidade</option></select>
  <select id="fReg" class="oculto"><option value="">Região</option></select>
  <button class="bt" id="btJanela" title="Janela (arrastar: brilho/contraste)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/></svg><span>Janela</span></button>
  <button class="bt" id="btMover" title="Mover (pan)"><svg viewBox="0 0 24 24"><path d="M5 9l-3 3 3 3M9 5l3-3 3 3M15 19l-3 3-3-3M19 9l3 3-3 3M2 12h20M12 2v20"/></svg><span>Mover</span></button>
  <button class="bt" id="btInv" title="Inverter (negativo)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v18"/></svg></button>
  <button class="bt" id="btAchado" title="Mostrar achado"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="9" stroke-dasharray="3 3"/></svg></button>
  <button class="bt" id="btInfo" title="Dados do caso"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.5"/></svg></button>
  <button class="bt" id="btReset" title="Reajustar"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"/></svg></button>
</div>

<div id="galeria" class="oculto"><div id="grade"></div><div class="aviso" id="galVazia" hidden>Nenhum caso com esses filtros.</div></div>

<div id="treinoCfg" class="oculto">
  <h2>Olho treinado</h2>
  <p>Só a imagem, cronometrada. Formule a hipótese, revele o gabarito e marque se acertou. Casos com diagnóstico escrito na própria imagem ficam de fora.</p>
  <div class="linhaCfg"><select id="tMod"><option value="">Todas as modalidades</option></select><select id="tReg"><option value="">Todas as regiões</option></select></div>
  <button class="btg" id="btComecar">Começar</button>
  <p id="tDisp"></p>
</div>

<div id="stage" class="oculto">
  <div id="plate"><img id="foto" alt=""><svg id="anot" viewBox="0 0 1000 1000" preserveAspectRatio="none"></svg></div>
  <div id="hud">janela: arraste • zoom: pinça/roda • duplo toque: reajusta</div>
  <div id="cron">0:00</div>
</div>

<div id="notaBox">
  <button class="btg" id="btRevelar">Revelar</button>
  <span id="notaPergunta" class="oculto">Acertou a hipótese?</span>
  <button class="btg ok oculto" id="btAcertei">Acertei</button>
  <button class="btg err oculto" id="btErrei">Errei</button>
  <button class="btg oculto" id="btProximoCaso">Próximo caso</button>
</div>

<div id="info" class="oculto"></div>

<script src="casos.js"></script>
<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const P=new URLSearchParams(location.search);
const CASOS=window.CASOS||[];
const porId=Object.fromEntries(CASOS.map(c=>[c.id,c]));

/* ---------- estado do visor ---------- */
const st={s:1,tx:0,ty:0,bri:1,con:1,inv:0,modo:"janela",fit:1};
let casoAtual=null, imgW=0, imgH=0, modoApp="galeria", achadoVis=false;

function aplica(){
  $("#plate").style.transform=`translate(${st.tx}px,${st.ty}px) scale(${st.s})`;
  $("#foto").style.filter=`brightness(${st.bri}) contrast(${st.con}) invert(${st.inv})`;
  $("#hud").textContent=`zoom ${(st.s/st.fit).toFixed(2)}x • B ${st.bri.toFixed(2)} • C ${st.con.toFixed(2)}${st.inv?" • inv":""}`;
}
function reset(){
  const est=$("#stage").getBoundingClientRect();
  if(!imgW){aplica();return}
  st.fit=Math.min(est.width/imgW,est.height/imgH)*0.98;
  st.s=st.fit; st.tx=(est.width-imgW*st.s)/2; st.ty=(est.height-imgH*st.s)/2;
  st.bri=1; st.con=1; aplica();
}
function carrega(src,alt,cb){
  const f=$("#foto"); f.alt=alt||"";
  f.onload=()=>{imgW=f.naturalWidth;imgH=f.naturalHeight;f.style.width=imgW+"px";reset();cb&&cb()};
  f.src=src;
}
function desenhaAnot(caso){
  const svg=$("#anot"); svg.innerHTML="";
  (caso&&caso.anot||[]).forEach(a=>{
    const c=document.createElementNS("http://www.w3.org/2000/svg","circle");
    c.setAttribute("cx",a.x*1000); c.setAttribute("cy",a.y*1000); c.setAttribute("r",(a.r||0.1)*1000);
    c.setAttribute("fill","none"); c.setAttribute("stroke","#FFB020");
    c.setAttribute("stroke-width",8); c.setAttribute("vector-effect","non-scaling-stroke");
    svg.appendChild(c);
  });
  svg.style.width=imgW+"px"; svg.style.height=imgH+"px";
  svg.setAttribute("viewBox","0 0 1000 1000");
}

/* ---------- interação (janela / pan / pinça / roda) ---------- */
const pts=new Map(); let pinch0=null;
const stage=$("#stage");
stage.addEventListener("pointerdown",e=>{try{stage.setPointerCapture(e.pointerId)}catch(_){ }pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===2){const [a,b]=[...pts.values()];pinch0={d:Math.hypot(a.x-b.x,a.y-b.y),s:st.s,mx:(a.x+b.x)/2,my:(a.y+b.y)/2,tx:st.tx,ty:st.ty}}});
stage.addEventListener("pointermove",e=>{
  if(!pts.has(e.pointerId))return;
  const p=pts.get(e.pointerId), dx=e.clientX-p.x, dy=e.clientY-p.y;
  if(pts.size===1){
    if(st.modo==="janela"){st.con=Math.min(4,Math.max(0.2,st.con+dx*0.004));st.bri=Math.min(4,Math.max(0.2,st.bri-dy*0.004))}
    else{st.tx+=dx;st.ty+=dy}
    p.x=e.clientX;p.y=e.clientY;aplica();
  }else if(pts.size===2&&pinch0){
    p.x=e.clientX;p.y=e.clientY;
    const [a,b]=[...pts.values()], d=Math.hypot(a.x-b.x,a.y-b.y), mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
    const f=d/pinch0.d, s=Math.min(40,Math.max(0.05,pinch0.s*f));
    st.tx=mx-(pinch0.mx-pinch0.tx)*(s/pinch0.s); st.ty=my-(pinch0.my-pinch0.ty)*(s/pinch0.s); st.s=s; aplica();
  }
});
const soltaPt=e=>{pts.delete(e.pointerId);if(pts.size<2)pinch0=null};
stage.addEventListener("pointerup",soltaPt); stage.addEventListener("pointercancel",soltaPt);
stage.addEventListener("wheel",e=>{e.preventDefault();
  const r=stage.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
  const f=Math.exp(-e.deltaY*0.0016), s=Math.min(40,Math.max(0.05,st.s*f));
  st.tx=mx-(mx-st.tx)*(s/st.s); st.ty=my-(my-st.ty)*(s/st.s); st.s=s; aplica();
},{passive:false});
let ultToque=0;
stage.addEventListener("pointerup",e=>{const ag=Date.now(); if(ag-ultToque<300&&pts.size===0)reset(); ultToque=ag});
stage.addEventListener("dblclick",reset);

/* ---------- barra ---------- */
function setModo(m){st.modo=m;stage.classList.toggle("mover",m==="mover");
  $("#btJanela").classList.toggle("on",m==="janela");$("#btMover").classList.toggle("on",m==="mover")}
$("#btJanela").onclick=()=>setModo("janela");
$("#btMover").onclick=()=>setModo("mover");
$("#btInv").onclick=()=>{st.inv=st.inv?0:1;$("#btInv").classList.toggle("on",!!st.inv);aplica()};
$("#btReset").onclick=reset;
$("#btAchado").onclick=()=>{achadoVis=!achadoVis;$("#anot").classList.toggle("vis",achadoVis);$("#btAchado").classList.toggle("on",achadoVis)};
$("#btInfo").onclick=()=>{$("#info").classList.toggle("oculto")};
addEventListener("resize",()=>{if(!$("#stage").classList.contains("oculto"))reset()});

/* ---------- telas ---------- */
function mostra(tela){
  ["galeria","treinoCfg","stage"].forEach(id=>$("#"+id).classList.toggle("oculto",id!==tela));
  const emViewer=tela==="stage";
  ["btJanela","btMover","btInv","btAchado","btReset"].forEach(id=>$("#"+id).classList.toggle("oculto",!emViewer));
  $("#btInfo").classList.toggle("oculto",!emViewer||modoApp==="img");
  $("#fMod").classList.toggle("oculto",tela!=="galeria");
  $("#fReg").classList.toggle("oculto",tela!=="galeria");
  if(!emViewer){$("#info").classList.add("oculto");$("#notaBox").style.display="none"}
}

function infoCaso(c,completo){
  const chips=`<span class="chip b">${esc(c.modalidade)}</span><span class="chip">${esc(c.sequencia||"")}</span><span class="chip">${esc(c.regiao)}</span>${c.sinal?`<span class="chip">${esc(c.sinal)}</span>`:""}`;
  const corpo=completo?`<h3>${esc(c.diagnostico)}</h3><div class="meta">${chips}</div>
    <div><b>Achado:</b> ${esc(c.achado)}</div>
    <div style="margin-top:4px"><b>Confirmação:</b> ${esc(c.confirmado)}</div>
    <div class="lic">${esc(c.fonte||"")} — ${esc(c.licenca||"")}${c.autor?" — "+esc(c.autor):""}</div>`
   :`<div class="meta">${chips}</div><div style="color:var(--mut)">Diagnóstico oculto — formule a hipótese e revele.</div>`;
  $("#info").innerHTML=corpo;
}

/* ---------- galeria ---------- */
function preencheFiltro(sel,vals){vals.forEach(v=>{const o=document.createElement("option");o.value=v;o.textContent=v;sel.appendChild(o)})}
function montaGaleria(){
  modoApp="galeria";$("#titulo").textContent=`Casos (${CASOS.length})`;mostra("galeria");
  const fm=$("#fMod").value,fr=$("#fReg").value;
  const lista=CASOS.filter(c=>(!fm||c.modalidade===fm)&&(!fr||c.regiao===fr));
  const g=$("#grade");g.innerHTML="";
  lista.forEach(c=>{
    const b=document.createElement("button");b.className="card";
    b.innerHTML=`<img loading="lazy" src="${esc(c.arquivo)}" alt="${esc(c.alt||c.achado)}"><div class="leg">${esc(c.modalidade)} • ${esc(c.regiao)}${c.sinal?` • ${esc(c.sinal)}`:""}</div>`;
    b.onclick=()=>abreCaso(c.id,true);
    g.appendChild(b);
  });
  $("#galVazia").hidden=lista.length>0;
}
$("#fMod").onchange=montaGaleria; $("#fReg").onchange=montaGaleria;

function abreCaso(id,comInfo){
  const c=porId[id]; if(!c)return;
  casoAtual=c; modoApp="caso"; mostra("stage");
  $("#titulo").textContent=c.sinal||c.regiao;
  achadoVis=false;$("#anot").classList.remove("vis");$("#btAchado").classList.remove("on");
  carrega(c.arquivo,c.alt,()=>desenhaAnot(c));
  infoCaso(c,true); if(comInfo)$("#info").classList.remove("oculto");
}

/* ---------- ordem da fila ----------
   Mesma correção do index.html (e do TráfegoTítulo): `sort(()=>Math.random()-0.5)`
   não embaralha (viés medido de +18%/-20% a favor do começo do vetor) e os casos
   saem agrupados por região na ordem crua (8 dos 15 pares adjacentes). Aqui a
   chave de espalhamento é a REGIÃO, não o tema. */
function embaralha(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
/* sorteio PONDERADO pelo que resta de cada chave, proibindo repetir a anterior.
   Não trocar por "pega sempre a maior": a versão determinística degenera em
   pingue-pongue entre as duas chaves mais numerosas. */
function espalhaPor(lista,chave){
  const grupos=new Map();
  lista.forEach(x=>{
    const k=x[chave]||"_";
    if(!grupos.has(k))grupos.set(k,[]);
    grupos.get(k).push(x);
  });
  grupos.forEach(v=>embaralha(v));
  const out=[]; let anterior=null;
  while(out.length<lista.length){
    const cand=[]; let peso=0;
    grupos.forEach((v,k)=>{ if(v.length&&k!==anterior){cand.push([k,v.length]);peso+=v.length} });
    let escolhido=null;
    if(cand.length){
      let r=Math.random()*peso;
      for(const [k,n] of cand){ r-=n; if(r<=0){escolhido=k;break} }
      if(escolhido===null)escolhido=cand[cand.length-1][0];
    }else{
      grupos.forEach((v,k)=>{ if(v.length)escolhido=k });   // só sobrou a anterior
    }
    out.push(grupos.get(escolhido).pop());
    anterior=escolhido;
  }
  return out;
}

/* ---------- olho treinado ---------- */
let fila=[],idxTreino=0,t0=0,cronId=null;
function elegiveisTreino(){const fm=$("#tMod").value,fr=$("#tReg").value;
  return CASOS.filter(c=>!c.espoiler&&(!fm||c.modalidade===fm)&&(!fr||c.regiao===fr))}
function montaTreinoCfg(){
  modoApp="treino";$("#titulo").textContent="Olho treinado";mostra("treinoCfg");
  $("#tDisp").textContent=`${elegiveisTreino().length} casos disponíveis com esses filtros.`;
}
$("#tMod").onchange=montaTreinoCfg;$("#tReg").onchange=montaTreinoCfg;
$("#btComecar").onclick=()=>{
  fila=espalhaPor(embaralha(elegiveisTreino()),"regiao");
  if(!fila.length)return;
  idxTreino=0; proximoCaso();
};
function proximoCaso(){
  if(idxTreino>=fila.length){fimTreino();return}
  casoAtual=fila[idxTreino]; mostra("stage");
  $("#titulo").textContent=`Caso ${idxTreino+1}/${fila.length}`;
  achadoVis=false;$("#anot").classList.remove("vis");$("#btAchado").classList.remove("on");
  $("#btAchado").classList.add("oculto"); // sem espiar antes de revelar
  carrega(casoAtual.arquivo,"Caso de treino — diagnóstico oculto",()=>desenhaAnot(casoAtual));
  infoCaso(casoAtual,false);$("#info").classList.remove("oculto");
  $("#notaBox").style.display="flex";
  $("#btRevelar").classList.remove("oculto");
  ["notaPergunta","btAcertei","btErrei","btProximoCaso"].forEach(id=>$("#"+id).classList.add("oculto"));
  t0=Date.now();$("#cron").style.display="block";
  clearInterval(cronId);cronId=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);
    $("#cron").textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`},250);
}
$("#btRevelar").onclick=()=>{
  clearInterval(cronId);
  infoCaso(casoAtual,true);
  $("#btAchado").classList.remove("oculto");
  if(casoAtual.anot){achadoVis=true;$("#anot").classList.add("vis");$("#btAchado").classList.add("on")}
  $("#btRevelar").classList.add("oculto");
  ["notaPergunta","btAcertei","btErrei"].forEach(id=>$("#"+id).classList.remove("oculto"));
};
function registra(ok){
  const tempoS=Math.round((Date.now()-t0)/1000);
  try{parent.postMessage({rt:"treino",id:casoAtual.id,ok,tempoS},location.origin)}catch(e){}
  idxTreino++; proximoCaso();
}
$("#btAcertei").onclick=()=>registra(true);
$("#btErrei").onclick=()=>registra(false);
function fimTreino(){
  clearInterval(cronId);$("#cron").style.display="none";$("#notaBox").style.display="none";
  montaTreinoCfg();
  $("#tDisp").textContent="Sequência concluída — o desempenho foi para o Painel do app.";
}
$("#btVoltar").onclick=()=>{
  clearInterval(cronId);$("#cron").style.display="none";$("#notaBox").style.display="none";
  if(modoApp==="caso")montaGaleria();
  else if(modoApp==="treino"&&!$("#stage").classList.contains("oculto"))montaTreinoCfg();
  else if(P.get("modo")==="treino")montaTreinoCfg();
  else montaGaleria();
};

/* ---------- boot ---------- */
(function(){
  const mods=[...new Set(CASOS.map(c=>c.modalidade))].sort();
  const regs=[...new Set(CASOS.map(c=>c.regiao))].sort();
  preencheFiltro($("#fMod"),mods);preencheFiltro($("#fReg"),regs);
  preencheFiltro($("#tMod"),mods);preencheFiltro($("#tReg"),regs);
  setModo("janela");
  const img=P.get("img");
  if(img&&/^img\/[a-z0-9\-]+\.(webp|png|jpe?g)$/i.test(img)){
    modoApp="img";$("#titulo").textContent=P.get("t")||"Imagem";mostra("stage");
    $("#btVoltar").style.display="none";carrega(img,P.get("alt")||"");
  }
  else if(P.get("caso")&&porId[P.get("caso")]) abreCaso(P.get("caso"),true);
  else if(P.get("modo")==="treino") montaTreinoCfg();
  else montaGaleria();
})();
window.__visor={st,get caso(){return casoAtual},get modo(){return modoApp},reset,setModo};
</script>
</body>
</html>
