<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F7F5F1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>RadioTítulo</title>
<!-- conta + sincronização (cópia de ~/Documents/Claude/_mtsync/). Síncrono no <head>: o portão
     cobre a tela antes do primeiro pixel do app e só sai com a conta confirmada. -->
<script src="mtsync.js"></script>
<style>
@font-face{font-family:'STIX Two Text';src:url('vendor/fonts/stix-two-text.woff2') format('woff2');font-weight:400 700;font-style:normal;font-display:swap}
:root{--bg:#F7F5F1;--pan:#FFFFFF;--pan2:#F1EEE8;--line:#E4E0D7;--linha2:#D6D1C4;--ink:#20242B;--mut:#63707E;--brand:#0E5A6D;--brand2:#0A4854;--tinta:#E4EFF0;--ok:#166534;--err:#B4231F;--warn:#A16207;--r:10px;--serif:'STIX Two Text',Georgia,'Times New Roman',serif;--sh:0 1px 2px rgba(32,36,43,.05),0 2px 6px rgba(32,36,43,.04)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.55 Inter,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100dvh;padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font-size:16px;font-family:inherit;background:#fff;color:var(--ink);border:1px solid var(--linha2);border-radius:8px;padding:8px 10px}
input:focus,select:focus,textarea:focus{outline:2px solid #9FC3CB;outline-offset:0;border-color:var(--brand)}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--brand)}
a{color:var(--brand2)}
svg.ic{width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none}
#faixas{position:sticky;top:0;z-index:50}
.faixa{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;font-size:13.5px;border-bottom:1px solid var(--line)}
.faixa.ok{background:#E6F4EA;color:#14532D}.faixa.erro{background:#FBEAE9;color:#7F1D1D}.faixa.info{background:#E7F0F2;color:#0A4854}
.faixa button{margin-left:auto;color:inherit;opacity:.6;font-size:16px;padding:0 4px}
/* ---------- cabeçalho editorial ---------- */
header{position:sticky;top:0;z-index:40;background:rgba(247,245,241,.95);backdrop-filter:blur(10px)}
.topo{display:flex;align-items:baseline;gap:12px;padding:14px 16px 8px;max-width:900px;margin:0 auto}
.topo .marca{display:flex;align-items:center;gap:9px}
.topo h1{font-family:var(--serif);font-size:22px;font-weight:700;letter-spacing:.2px;color:var(--ink)}
.topo h1 em{font-style:normal;color:var(--brand)}
.topo .sub{color:var(--mut);font-size:11.5px;margin-left:auto;text-align:right;letter-spacing:.2px}
.regua{max-width:900px;margin:0 auto;padding:0 16px}
.regua i{display:block;border-top:2px solid var(--ink);border-bottom:1px solid var(--linha2);height:4px}
nav{display:flex;gap:2px;overflow-x:auto;padding:2px 8px 0;scrollbar-width:none;max-width:900px;margin:0 auto}
nav::-webkit-scrollbar{display:none}
nav button{display:flex;align-items:center;gap:6px;padding:9px 11px;color:var(--mut);font-size:12.5px;font-weight:600;letter-spacing:.35px;text-transform:uppercase;border-bottom:2px solid transparent;white-space:nowrap;min-height:42px}
nav button svg.ic{width:16px;height:16px;stroke-width:1.8}
nav button:hover{color:var(--ink)}
nav button.on{color:var(--brand);border-bottom-color:var(--brand)}
header{border-bottom:1px solid var(--line)}
main{max-width:900px;margin:0 auto;padding:18px 16px 64px}
section{display:none}section.on{display:block}
/* ---------- cartões e títulos ---------- */
.cartao{background:var(--pan);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.cartao h2{font-family:var(--serif);font-size:17px;font-weight:600;color:var(--ink);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.linha{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--brand);color:#fff;border-radius:8px;padding:10px 16px;font-weight:600;font-size:14px;min-height:42px;transition:background .15s}
.btn:hover{background:var(--brand2)}
.btn.fant{background:#fff;border:1px solid var(--linha2);color:#3E4A56;font-weight:500}
.btn.fant:hover{background:var(--pan2)}
.btn.perigo{background:var(--err);color:#fff}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;pointer-events:none}
.chip{display:inline-flex;align-items:center;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.3px;color:var(--mut);background:var(--pan2);border:1px solid var(--linha2)}
.chip.tema{background:var(--tf,var(--pan2));color:var(--tt,var(--mut));border:none}
.chip.real{color:#14532D;background:#DCEFE2;border:none}
.chip.aut{color:var(--mut)}
.mut{color:var(--mut)}.peq{font-size:12.5px}
.gd{font-family:var(--serif);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{color:var(--mut);text-align:left;font-weight:600;font-size:11px;padding:6px 8px;border-bottom:1px solid var(--linha2);text-transform:uppercase;letter-spacing:.5px}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
tr.clic{cursor:pointer}tr.clic:hover{background:#FBFAF6}
.ponto{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:baseline}
.vermelho{color:var(--err)}.verde{color:var(--ok)}.ambar{color:var(--warn)}
.rolagem{overflow-x:auto}
/* ---------- questões ---------- */
.q-topo{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.q-num{font-family:var(--serif);font-size:14px;font-weight:600;color:var(--mut);margin-left:auto;font-variant-numeric:tabular-nums}
.q-enun{font-size:15.5px;margin:10px 0 14px;white-space:pre-wrap;line-height:1.68}
.q-img{position:relative;margin:0 0 14px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#10151B;cursor:zoom-in}
.q-img img{display:block;width:100%;max-height:420px;object-fit:contain}
.q-img .lupa{position:absolute;right:8px;bottom:8px;background:rgba(255,255,255,.93);border-radius:7px;padding:4px 9px;font-size:12px;color:#3E4A56}
.alt{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);border-radius:9px;padding:11px 13px;margin-bottom:8px;background:#FDFCF9;font-size:14.5px;touch-action:pan-y;position:relative;transition:border-color .15s,background .15s}
.alt:hover{border-color:#A9C5CB}
.alt .letra{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--linha2);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:13px;font-weight:600;color:var(--mut);background:#fff}
.alt.sel{border-color:var(--brand);background:var(--tinta)}
.alt.sel .letra{background:var(--brand);border-color:var(--brand);color:#fff}
.alt.certa{border-color:#5CA97C;background:#EDF7F0}
.alt.certa .letra{background:var(--ok);border-color:var(--ok);color:#fff}
.alt.errada{border-color:#DA9490;background:#FAEFEE}
.alt.errada .letra{background:var(--err);border-color:var(--err);color:#fff}
.alt.riscada .txt{text-decoration:line-through;opacity:.45}
.alt .risco{margin-left:auto;flex:none;color:var(--mut);opacity:.4;padding:2px}
.alt .risco:hover{opacity:.9}
.alt .risco svg{width:15px;height:15px}
.coment{border-left:3px solid var(--brand);background:#F4F7F5;border-radius:0 9px 9px 0;padding:13px 14px;margin-top:12px;font-size:14px}
.coment .porq{margin-top:9px;padding-top:9px;border-top:1px solid #DCE4DE}
.coment .porq div{margin-bottom:5px}
.navq{display:flex;gap:8px;margin-top:14px;align-items:center}
/* ---------- simulado ---------- */
.gradeSim{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.gradeSim button{border:1px solid var(--line);border-radius:8px;padding:8px 0;font-family:var(--serif);font-size:13px;font-weight:600;color:var(--mut);background:#fff}
.gradeSim button.resp{background:var(--tinta);color:var(--brand2);border-color:#9FC3CB}
.gradeSim button.atual{outline:2px solid var(--brand);outline-offset:1px}
.gradeSim button.certa{background:#EDF7F0;color:var(--ok);border-color:#5CA97C}
.gradeSim button.errada{background:#FAEFEE;color:var(--err);border-color:#DA9490}
#cronSim{font-family:var(--serif);font-variant-numeric:tabular-nums;font-size:24px;font-weight:700}
/* ---------- painel ---------- */
.cardsMini{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.mini{background:var(--pan);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--sh);border-top:3px solid var(--ac,var(--brand))}
.mini.a1{--ac:#0E5A6D}.mini.a2{--ac:#166534}.mini.a3{--ac:#A16207}.mini.a4{--ac:#155E75}
.mini .rot{color:var(--mut);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px}
.mini .gd{margin-top:2px}
.barra{height:8px;background:var(--pan2);border-radius:99px;overflow:hidden;margin-top:4px}
.barra i{display:block;height:100%;background:var(--bc,var(--brand));border-radius:99px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{width:11px;height:11px;border-radius:3px;background:var(--pan2)}
.heat i.h1{background:#BFD8DC}.heat i.h2{background:#6FA5AF}.heat i.h3{background:#2E7787}.heat i.h4{background:#0E5A6D}
/* ---------- flashcards ---------- */
.flash{min-height:230px;display:flex;flex-direction:column;gap:16px;align-items:center;justify-content:center;text-align:center;padding:20px}
.flash .frente{font-family:var(--serif);font-size:19px;font-weight:600;max-width:620px;line-height:1.45}
.flash .verso{font-size:14.5px;color:var(--ink);max-width:660px;white-space:pre-wrap;text-align:left;background:#F4F7F5;border:1px solid #DCE4DE;border-radius:9px;padding:13px 15px;line-height:1.6}
/* ---------- imagens ---------- */
#quadroImg{height:calc(100dvh - 175px);min-height:420px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#10151B;box-shadow:var(--sh)}
#quadroImg iframe{width:100%;height:100%;border:0}
/* ---------- lightbox ---------- */
#luz{position:fixed;inset:0;z-index:90;background:rgba(16,21,27,.94);display:none;flex-direction:column}
#luz.on{display:flex}
#luz .fecha{position:absolute;top:10px;right:10px;z-index:2;background:#fff;border-radius:8px;padding:8px 12px;color:var(--ink)}
#luz iframe{flex:1;border:0}
/* ---------- erros ---------- */
#tbErros input,#tbErros textarea{width:100%;border:none;background:transparent;padding:2px;font-size:13.5px;border-radius:4px}
#tbErros textarea{resize:vertical;min-height:34px}
#tbErros input:focus,#tbErros textarea:focus{background:var(--tinta);outline:1px solid var(--brand)}
@media(max-width:600px){.topo{padding:12px 12px 6px}.topo h1{font-size:19px}.topo .sub{display:none}main{padding:14px 10px 64px}}
/* ============================================================
   23/09/2026, rt-v17: camada "viva", portada do ClínicaMed (cm-v97/v98), que o Matheus aprovou
   ("melhorou muito") depois de reprovar o visual por "muito quadrado, tudo da mesma cor e pouco
   dinâmico". Pedido: levar as mesmas mudanças aos outros apps de estudo RESPEITANDO A COR DE CADA UM
   e "quando abrir a página, já ver a questão toda". Aqui a marca continua o azul-petróleo #0E5A6D
   (identidade de 24/08, serif STIX nos títulos e números). Três eixos:
   1. forma: cartões de 22 px com sombra suave, botões e filtros em pílula, letras e ícones em círculo;
   2. cor: cada aba tem a sua (--ac em body[data-aba]), tons de janela de imagem: Questões e Painel no
      petróleo da marca, Simulado âmbar, Imagens violeta, Cartões ciano, Erros magenta, Plano verde,
      Ajustes ardósia. Acerto verde, erro vermelho. Texto branco só sobre fundo com 4.5:1 ou mais;
   3. movimento: entrada escalonada ao trocar de aba, contadores, barras e anel que se preenchem,
      questão que desliza na direção da navegação, acerto que pulsa, erro que treme, "N seguidas",
      confete ao bater a meta do dia. Movimento reduzido respeitado no fim do bloco.
   Questão inteira na tela (1512×763): cabeçalho numa linha só, filtro fino, cartão largo, alternativas
   de ~46 px e, com imagem, imagem à esquerda e questão à direita. Sem gradiente e sem emoji.
   EXCEÇÃO mantida: visor.html e o visor embutido (#quadroImg, #luz) continuam escuros e intocados.
   ============================================================ */
:root{
  --c-petroleo:#0E5A6D; --c-ambar:#B45309; --c-violeta:#6D28D9; --c-ciano:#0369A1;
  --c-magenta:#BE185D; --c-verde:#15803D; --c-ardosia:#475467;
  --ac:var(--brand);
  --acSup:color-mix(in srgb,var(--ac) 10%,#fff); --acInk:color-mix(in srgb,var(--ac) 82%,var(--ink));
  --okSup:#E9F6EE; --errSup:#FBECEB;
  --rG:22px;
  --sombra:0 1px 2px rgba(32,36,43,.04),0 4px 14px rgba(32,36,43,.05);
  --sombraM:0 10px 30px rgba(32,36,43,.10),0 2px 6px rgba(32,36,43,.05);
  --mola:cubic-bezier(.34,1.56,.64,1);
}
body[data-aba="questoes"],body[data-aba="painel"]{--ac:var(--c-petroleo)}
body[data-aba="simulado"]{--ac:var(--c-ambar)}
body[data-aba="imagens"]{--ac:var(--c-violeta)}
body[data-aba="cartoes"]{--ac:var(--c-ciano)}
body[data-aba="erros"]{--ac:var(--c-magenta)}
body[data-aba="plano"]{--ac:var(--c-verde)}
body[data-aba="ajustes"]{--ac:var(--c-ardosia)}
body[data-aba]{--acSup:color-mix(in srgb,var(--ac) 10%,#fff);--acInk:color-mix(in srgb,var(--ac) 82%,var(--ink))}

/* ---------- cabeçalho e abas em pílula, cada aba com a sua cor ---------- */
.topo .marca>svg{color:var(--c-petroleo)!important}
nav{gap:4px;padding:6px 10px 8px}
nav button{text-transform:none;letter-spacing:0;font-size:13.5px;font-weight:600;color:var(--mut);border:0;border-radius:999px;
  padding:4px 13px 4px 4px;gap:8px;min-height:38px;transition:background .2s,color .2s}
nav button svg.ic{width:30px;height:30px;padding:7px;border-radius:50%;stroke-width:2;
  background:color-mix(in srgb,var(--c) 12%,transparent);color:var(--c);transition:transform .25s var(--mola),background .2s,color .2s}
nav button:hover{background:#fff;color:var(--ink)}
nav button:hover svg.ic{transform:scale(1.1) rotate(-6deg)}
nav button.on{background:color-mix(in srgb,var(--c) 11%,#fff);color:color-mix(in srgb,var(--c) 80%,var(--ink));border:0}
nav button.on svg.ic{background:var(--c);color:#fff;box-shadow:0 5px 12px color-mix(in srgb,var(--c) 35%,transparent)}
@media(min-width:1180px){
  header{display:flex;align-items:center;gap:22px;padding:9px max(24px,calc((100vw - 1240px)/2))}
  .topo{margin:0;padding:0;max-width:none;flex:0 0 auto;align-items:center}
  .topo .sub{display:none}
  .regua{display:none}
  nav{margin:0;padding:0;max-width:none;flex:1 1 auto;justify-content:flex-end}
  main{max-width:1240px;padding:18px 24px 64px}
}
@media(min-width:900px) and (max-width:1179px){main{max-width:1080px}.topo,.regua,nav{max-width:1080px}}

/* a questão entra deslizando 26 px: sem isto a página ganharia rolagem lateral durante a animação */
main{overflow-x:clip}
/* ---------- superfícies e controles ---------- */
.cartao{border-radius:var(--rG);border:1px solid var(--line);box-shadow:var(--sombra);padding:20px 22px;margin-bottom:16px}
.cartao h2{border-bottom:0;padding-bottom:0;margin-bottom:14px;display:flex;align-items:center;gap:10px;letter-spacing:-.01em}
.cartao h2::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--ac);flex:none;box-shadow:0 0 0 4px var(--acSup)}
.btn{border-radius:999px;padding:9px 20px;background:var(--ac);color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--ac) 26%,transparent);
  transition:transform .15s var(--mola),box-shadow .2s,filter .2s,background .15s}
.btn:hover{background:var(--ac);filter:brightness(1.1);transform:translateY(-1px);box-shadow:0 10px 22px color-mix(in srgb,var(--ac) 32%,transparent)}
.btn:active{transform:scale(.96)}
.btn.fant{background:#fff;border:1px solid var(--linha2);color:#3E4A56;box-shadow:none}
.btn.fant:hover{background:var(--pan2);filter:none}
.btn.perigo{background:var(--err);box-shadow:0 6px 16px color-mix(in srgb,var(--err) 26%,transparent)}
.btn.peq{min-height:32px;padding:4px 13px;font-size:12.5px}
.btn[disabled]{box-shadow:none}
input,select,textarea{border-radius:12px}
select{border-radius:999px;padding:7px 14px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 16%,transparent)}
input[type=checkbox]{accent-color:var(--ac)}
#tbErros input:focus,#tbErros textarea:focus{box-shadow:none;outline:1px solid var(--ac);background:var(--acSup)}
.chip{border-radius:999px;padding:4px 11px}
.barra{height:8px;background:#ECE8E0}
.barra i{transition:width 1s cubic-bezier(.22,1,.36,1)}
.faixa{border-radius:0}
table{font-variant-numeric:tabular-nums}
tr.clic{transition:background .15s}
tr.clic:hover{background:var(--acSup)}

/* ---------- questão ---------- */
#sec-questoes>.cartao:first-child{border-radius:999px;padding:6px 8px 6px 10px;margin-bottom:12px}
#sec-questoes>.cartao:first-child .linha{gap:8px}
#sec-questoes>.cartao:first-child select{min-height:36px;padding:6px 14px;font-size:14px;background:var(--pan2);border-color:transparent}
#sec-questoes>.cartao:first-child .mtt-btn{min-height:36px;padding:0 14px;font-size:14px;background:var(--pan2);border-color:transparent}
#sec-questoes>.cartao:first-child .mtt-btn.mtt-ativo{border-color:var(--ac,var(--brand))}
#sec-simulado .mtt-btn{min-width:min(240px,100%)}
#sec-questoes>.cartao:first-child #fqEmbaralha{margin-left:auto;width:38px;min-height:38px;padding:0;justify-content:center}
.qCard{padding:20px 28px 22px}
.q-topo{margin-bottom:10px}
.q-num{font-family:inherit;font-size:13px;color:var(--acInk);background:var(--acSup);padding:5px 13px;border-radius:999px}
#qFav{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;transition:transform .2s var(--mola),background .2s}
#qFav:hover{background:var(--pan2);transform:scale(1.08)}
.q-enun{margin:6px 0 14px;line-height:1.62}
.q-img{border-radius:18px;border:0}
.q-img .lupa{border-radius:999px;padding:4px 12px}
#qAlts,#simAlts{display:flex;flex-direction:column;gap:8px}
.alt{border-radius:18px;border:1.5px solid var(--line);background:#fff;padding:7px 12px 7px 8px;margin-bottom:0;min-height:46px;align-items:center;
  transition:transform .18s var(--mola),border-color .15s,background .15s,box-shadow .2s}
.qCard>.alt,.qCard>div>.alt{margin-bottom:8px}
.alt .letra{width:30px;height:30px;border:0;background:var(--pan2);font-family:inherit;font-weight:700;font-size:13px;color:#4A5563;
  transition:background .2s,color .2s,transform .25s var(--mola)}
.alt .txt{flex:1;min-width:0}
.alt .risco{align-self:center;border-radius:50%;padding:5px;opacity:.35}
.alt .risco:hover{background:var(--pan2)}
#qAlts .alt:not(.certa):not(.errada):hover,#simAlts .alt:hover{border-color:var(--ac);background:var(--acSup);transform:translateX(3px);box-shadow:0 6px 18px color-mix(in srgb,var(--ac) 12%,transparent)}
#qAlts .alt:not(.certa):not(.errada):hover .letra,#simAlts .alt:hover .letra{background:var(--ac);color:#fff}
.alt.sel{border-color:var(--ac);background:var(--acSup);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 14%,transparent)}
.alt.sel .letra{background:var(--ac);color:#fff}
.alt.certa{border-color:var(--ok);background:var(--okSup)}
.alt.errada{border-color:var(--err);background:var(--errSup)}
.alt.certa .letra{background:var(--ok);color:#fff;font-size:0}
.alt.certa .letra::before{content:"";width:12px;height:7px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:translateY(-2px) rotate(-45deg)}
.alt.errada .letra{background:var(--err);color:#fff}

.coment{border-left:0;border-radius:20px;background:#F3F6F6;border:1px solid var(--line);padding:14px 18px;animation:desliza .4s ease both}

.qCombo{display:inline-flex;align-items:center;gap:6px;margin-left:8px;border-radius:999px;padding:3px 11px;font-size:12px;font-weight:700;

@media(min-width:1100px){

/* ---------- simulado: grade de questões na lateral em tela larga ---------- */
.gradeSim{gap:6px}

#cronSim{color:var(--acInk);background:var(--acSup);padding:2px 14px;border-radius:999px;font-size:22px}
@media(min-width:1100px){
  #sec-simulado.on[data-modo="ativo"],#sec-simulado.on[data-modo="revisao"]{display:grid;grid-template-columns:minmax(0,1fr) 282px;column-gap:18px;align-items:start}

/* ---------- cartões (flash) ---------- */
.flash .verso{border-radius:18px;background:var(--acSup);border-color:color-mix(in srgb,var(--ac) 20%,transparent)}
.flash .verso:not([hidden]){animation:vira .5s cubic-bezier(.22,1,.36,1) both;transform-origin:top}

/* ---------- movimento ---------- */
.anima>*{animation:sobe .55s cubic-bezier(.22,1,.36,1) both;animation-delay:calc(var(--i,0) * 60ms)}
@keyframes sobe{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes marca{0%{transform:translateY(-2px) rotate(-45deg) scale(.2);opacity:0}100%{transform:translateY(-2px) rotate(-45deg) scale(1);opacity:1}}
@keyframes acerto{0%{transform:scale(1)}35%{transform:scale(1.025)}100%{transform:scale(1)}}
@keyframes treme{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
@keyframes desliza{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes entraQ{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes entraQv{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
@keyframes flutua{0%,100%{transform:translate(0,0)}50%{transform:translate(-14px,12px)}}
@keyframes chama{0%,100%{transform:scale(1) rotate(0)}30%{transform:scale(1.12) rotate(-5deg)}60%{transform:scale(.96) rotate(4deg)}}
@keyframes vira{from{opacity:0;transform:perspective(700px) rotateX(-70deg)}to{opacity:1;transform:none}}

</main>
<div id="luz"><button class="fecha" id="luzFecha">Fechar ✕</button><iframe id="luzFrame" title="Visor de imagem"></iframe></div>

<script>
"use strict";
/* ================== RadioTítulo v1 ================== */
const V="1.0.0";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dataISO=(d=new Date())=>{const p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`};
const addDiasISO=(iso,n)=>{const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()+n);return dataISO(d)};
const novoIdLinha=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const LETRAS="ABCDE";

/* ---------- 2.1 chave estável por conteúdo (djb2+FNV, Math.imul) ---------- */
function hashTxt(s){
  let h1=5381, h2=0x811c9dc5;
  for(let i=0;i<s.length;i++){
    const c=s.charCodeAt(i);
    h1=((h1<<5)+h1+c)>>>0;
    h2=Math.imul(h2^c, 0x01000193)>>>0;
  }
  return (h1.toString(36)+h2.toString(36)).slice(0,10);
}
function chaveTxt(t){
  t=String(t||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]/g,"");
  return hashTxt(t);
}
function chaveQ(q){ return chaveTxt(q.q); }

const BANCO=window.BANCO||[], TAXONOMIA=window.TAXONOMIA||[], FLASH=window.FLASH||[], CASOS=window.CASOS||[];
const QIDX=new Map(); BANCO.forEach(q=>{const ch=chaveQ(q); if(QIDX.has(ch))console.warn("COLISÃO de chave:",ch,q.q.slice(0,60)); QIDX.set(ch,q); q._ch=ch;});
const TNOME=Object.fromEntries(TAXONOMIA.map(t=>[t.id,t.nome]));
const TCOR=Object.fromEntries(TAXONOMIA.map(t=>[t.id,t.cor||{}]));
const chipTema=id=>`<span class="chip tema" style="--tf:${(TCOR[id]||{}).f||"#EEE"};--tt:${(TCOR[id]||{}).t||"#555"}">${esc(TNOME[id]||id)}</span>`;

/* ---------- UI: faixas de aviso ---------- */
const UI={
  banner(tipo,msg,fixa){
    const d=document.createElement("div");d.className="faixa "+tipo;
    d.innerHTML=`<span>${esc(msg)}</span><button aria-label="fechar">✕</button>`;
    d.querySelector("button").onclick=()=>d.remove();
    $("#faixas").appendChild(d);
    if(!fixa)setTimeout(()=>d.remove(),12000);
  }
};

/* ---------- 2.2 blindagem de armazenamento ---------- */
// PREF e a UNICA fonte do prefixo: RTKEYS deriva dele e listaBackups/restaura filtram por ele.
// Nao escrever o prefixo literal: ao copiar este ARM para o TrafegoTitulo o "rt_" fixo veio junto
// e la a lista de backups dizia 0 chaves e restaurar nao devolvia nada, em silencio.
const PREF="rt_";
const RTKEYS=["resp","riscos","fav","flash","erros","plano","meta","cfg","sim","simativo","pos","treino","atividade","sinal","syncmeta"].map(s=>PREF+s);
const ARM={
  db:null, travas:{}, persistOK:null, tsBackup:0, recuperado:null,
  async boot(){
    // timeout de segurança: IDB preso (aba antiga/modo privado) não pode travar o boot
    this.db=await Promise.race([new Promise(res=>setTimeout(()=>res(null),2500)),new Promise(res=>{
      try{
        const rq=indexedDB.open("rt-db",1);
        rq.onupgradeneeded=()=>{const d=rq.result;

function vivo(sec){

  [sec,...sec.querySelectorAll(".vIni")].forEach(alvo=>{
    alvo.classList.remove("anima");void alvo.offsetWidth;alvo.classList.add("anima");
    [...alvo.children].forEach((c,k)=>c.style.setProperty("--i",Math.min(k,12)));

    el.textContent="0"+suf;requestAnimationFrame(passo);

  const cresce=(els,prop,zero)=>els.forEach(el=>{const alvo=el.style[prop];if(!alvo)return;el.style.transition="none";el.style[prop]=zero;void el.offsetWidth;el.style.transition="";el.style[prop]=alvo});

/* confete leve em canvas: 1,6 s, some sozinho; nada se movimento reduzido */
function confete(){
  if(REDUZ())return;
  const cv=document.createElement("canvas");cv.className="confete";document.body.appendChild(cv);
  const dpr=devicePixelRatio||1,W=cv.width=innerWidth*dpr,H=cv.height=innerHeight*dpr,x=cv.getContext("2d");
  const cores=["#0E5A6D","#B45309","#6D28D9","#0369A1","#BE185D","#15803D","#F59E0B","#14B8A6"];
  const ps=[...Array(130)].map(()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.35,vx:(Math.random()-.5)*26*dpr,vy:(-Math.random()*22-6)*dpr,
    s:(6+Math.random()*7)*dpr,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cores[Math.random()*cores.length|0],f:Math.random()<.5}));
  const t0=performance.now();
  const q=t=>{const el=t-t0;x.clearRect(0,0,W,H);
    ps.forEach(p=>{p.vy+=.9*dpr;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.globalAlpha=Math.max(0,1-el/1600);x.fillStyle=p.c;
      if(p.f)x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);else{x.beginPath();x.arc(0,0,p.s/3,0,7);x.fill()}x.restore()});
    if(el<1600)requestAnimationFrame(q);else cv.remove()};
  requestAnimationFrame(q);
  setTimeout(()=>cv.remove(),2500);
}

/* ---------- ordem das questões ----------
   Portado do TráfegoTítulo (25/08/2026), que é fork daqui e onde o defeito foi
   diagnosticado. São DOIS defeitos somados:
   1) o banco é montado leva a leva e cada leva é temática — na ordem crua havia até
      17 questões seguidas do mesmo tema (505 dos 654 pares adjacentes iguais);
   2) `sort(()=>Math.random()-0.5)` NÃO embaralha: o comparador é inconsistente e o
      TimSort do V8 deixa o começo do vetor sobrerrepresentado (+18%/-20% medido).
      Isso enviesava sobretudo o SORTEIO DO SIMULADO, que puxava para os temas das
      primeiras levas. */

/* Fisher-Yates — permutação uniforme, no lugar */
function embaralha(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

/* Espalha os temas: a cada passo sorteia o próximo tema PONDERADO pelo que resta,
   proibindo repetir o tema anterior. Só repete quando é matematicamente inevitável
   (um tema com mais da metade do que sobrou). Dentro do tema, a ordem é aleatória. */
function espalhaTemas(lista){
  const grupos=new Map();
  lista.forEach(q=>{
    const k=q.tema||"_";
    if(!grupos.has(k))grupos.set(k,[]);
    grupos.get(k).push(q);
  });
  grupos.forEach(v=>embaralha(v));
  const out=[]; let anterior=null;
  while(out.length<lista.length){
    /* NÃO trocar por "pega sempre o tema com mais restantes": a versão determinística
       degenera em pingue-pongue entre os dois temas mais numerosos (só 3 temas
       distintos nas 20 primeiras). O sorteio ponderado é o que dá variedade. */
    const cand=[]; let peso=0;
    grupos.forEach((v,k)=>{ if(v.length&&k!==anterior){cand.push([k,v.length]);peso+=v.length} });
    let escolhido=null;
    if(cand.length){
      let r=Math.random()*peso;
      for(const [k,n] of cand){ r-=n; if(r<=0){escolhido=k;break} }
      if(escolhido===null)escolhido=cand[cand.length-1][0];
    }else{
      grupos.forEach((v,k)=>{ if(v.length)escolhido=k });   // só sobrou o anterior
    }
    out.push(grupos.get(escolhido).pop());
    anterior=escolhido;
  }
  return out;
}

function passaFiltroQ(q,f){

/* Mantém a MESMA ordem enquanto o filtro não muda (navegar e recarregar não
   reembaralham), mas com os temas espalhados desde a primeira abertura. */
function ordenaQuestoes(f,refazOrdem){
  const ass=assinaturaQ(f,QST.lista.length);
  const salva=ST.pos.ordq;
  if(!refazOrdem&&ST.pos.assq===ass&&Array.isArray(salva)){
    const porCh=new Map(QST.lista.map(q=>[q._ch,q]));
    const ord=[];
    salva.forEach(ch=>{const q=porCh.get(ch);if(q){ord.push(q);porCh.delete(ch)}});
    if(porCh.size)espalhaTemas([...porCh.values()]).forEach(q=>ord.push(q)); // questões novas do banco
    if(ord.length===QST.lista.length){QST.lista=ord;return}
  }
  QST.lista=espalhaTemas(QST.lista);
  ST.pos.assq=ass;
  ST.pos.ordq=QST.lista.map(q=>q._ch);

function ligaAlternativa(el,q){
  const i=+el.dataset.i;
  el.querySelector(".risco").onclick=e=>{e.stopPropagation();toggleRisco(q,i)};
  // arrastar para o lado risca (toque e mouse); clique seleciona
  let x0=null,y0=null,arrastou=false;
  el.addEventListener("pointerdown",e=>{x0=e.clientX;y0=e.clientY;arrastou=false});
  el.addEventListener("pointermove",e=>{
    if(x0===null||QST.respondida)return;
    if(Math.abs(e.clientX-x0)>56&&Math.abs(e.clientY-y0)<28&&!arrastou){arrastou=true;toggleRisco(q,i)}
  });
  el.addEventListener("pointerup",()=>{setTimeout(()=>{x0=null},0)});
  el.addEventListener("click",()=>{
    if(arrastou||QST.respondida)return;
    if((ST.riscos[q._ch]||[]).includes(i))return;
    QST.selecionada=i;
    document.querySelectorAll("#qAlts .alt").forEach(a=>a.classList.toggle("sel",+a.dataset.i===i));
    $("#qResp").disabled=false;
  });
}
function toggleRisco(q,i){
  const r=ST.riscos[q._ch]||(ST.riscos[q._ch]=[]);
  const p=r.indexOf(i);
  if(p>=0)r.splice(p,1);else{r.push(i);if(QST.selecionada===i){QST.selecionada=null;$("#qResp").disabled=true}}
  if(!r.length)delete ST.riscos[q._ch];
  ARM.save("rt_riscos",ST.riscos);
  const el=document.querySelector(`#qAlts .alt[data-i="${i}"]`);
  if(el){el.classList.toggle("riscada",p<0);el.classList.remove("sel")}
}
function respondeQuestao(q){
  if(QST.selecionada===null||QST.respondida)return;
  QST.respondida=true;
  const ok=QST.selecionada===q.gab;
  const md0=metaDoDia();
  registraResposta(q,QST.selecionada,ok,"estudo");
  COMBO=ok?COMBO+1:0;
  const md1=metaDoDia();
  if(md0&&md1&&md0.hoje<md0.meta&&md1.hoje>=md0.meta)setTimeout(confete,250);
  document.querySelectorAll("#qAlts .alt").forEach(el=>{
    const i=+el.dataset.i;
    if(i===q.gab)el.classList.add("certa");

  });
  $("#qResp").disabled=true;
  $("#qFeed").innerHTML=`<div class="coment ${ok?"ok":"er"}">

    ${q.porAlt?`<div class="porq">${q.porAlt.map((p,i)=>`<div><b>${LETRAS[i]})</b> ${esc(p)}</div>`).join("")}</div>`:""}
    ${ok?"":`<div style="margin-top:10px"><button class="btn fant" id="qLog">Anotar no log de erros</button></div>`}
  </div>`;
  const bl=$("#qLog");
  if(bl)bl.onclick=()=>{
    ST.erros.unshift({id:novoIdLinha(),d:dataISO(),tema:q.tema,ref:q._ch,oque:(q.sub||q.tema)+": "+q.q.slice(0,80)+"…",porque:"",licao:""});
    ARM.save("rt_erros",ST.erros);
    UI.banner("info","Anotado no log de erros. Complete o motivo e a lição na aba Erros.");
    bl.disabled=true;
  };
}

/* ================== PAINEL ================== */
function incidencia(){
  const reais=BANCO.filter(q=>q.fonte);
  if(reais.length<10)return {uniforme:true,map:Object.fromEntries(TAXONOMIA.map(t=>[t.id,1/TAXONOMIA.length]))};
  const m={};TAXONOMIA.forEach(t=>m[t.id]=reais.filter(q=>q.tema===t.id).length/reais.length);
  return {uniforme:false,map:m};
}
function statsTema(){
  const por={};
  for(const [ch,r] of Object.entries(ST.resp)){
    const q=QIDX.get(ch);if(!q)continue;          // chave órfã: ignora (falha segura)
    (por[q.tema]=por[q.tema]||[]).push(...r.hist);
  }
  return por;
}
function revisaoTemas(){
  const por=statsTema();
  return TAXONOMIA.map(t=>{
    const hs=(por[t.id]||[]).slice().sort((a,b)=>a.d<b.d?-1:1);
    if(!hs.length)return {t,nunca:true};
    const ult=hs[hs.length-1].d,u20=hs.slice(-20);
    const acc=u20.filter(h=>h.ok).length/u20.length;
    const iv=Math.max(1,Math.min(15,Math.round(1+14*acc*acc)));
    const due=addDiasISO(ult,iv);
    return {t,ult,acc,iv,due,atrasado:due<dataISO()};
  });
}
function ofensiva(){
  let d=new Date(),n=0;
  if(!ST.atividade[dataISO(d)])d.setDate(d.getDate()-1);
  while(ST.atividade[dataISO(d)]){n++;d.setDate(d.getDate()-1)}
  return n;
}
function montaPainel(){
  const sec=$("#sec-painel");
  const inc=incidencia(),por=statsTema();
  const totalResp=Object.values(ST.resp).reduce((a,r)=>a+r.hist.length,0);
  const unicas=Object.keys(ST.resp).filter(ch=>QIDX.has(ch)).length;
  const todasH=Object.values(por).flat();
  const accG=taxaAcerto(todasH);
  // prioridade
  const linhas=TAXONOMIA.map(t=>{
    const hs=por[t.id]||[],acc=taxaAcerto(hs);
    const erro=acc===null?0.7:1-acc;
    return {t,acc,erro,inc:inc.map[t.id]||0,pri:(inc.map[t.id]||0)*erro,semDados:acc===null};
  }).sort((a,b)=>b.pri-a.pri);
  const maxPri=Math.max(...linhas.map(l=>l.pri),0.0001);
  // meta
  const m=ST.meta;
  let metaTxt="";

/* ================== CARTÕES (SM-2 simplificado) ================== */
function sm2(st,nota){
  if(nota<3){st.reps=0;st.iv=1}
  else{st.reps=(st.reps||0)+1;st.iv=st.reps===1?1:st.reps===2?6:Math.round((st.iv||1)*(st.ef||2.5))}
  st.ef=Math.max(1.3,(st.ef||2.5)+(0.1-(5-nota)*(0.08+(5-nota)*0.02)));
  st.due=addDiasISO(dataISO(),st.iv);
  st.ts=Date.now();
  return st;
}
function cartoesDeHoje(){
  const hj=dataISO();
  return FLASH.map(c=>({c,ch:chaveTxt(c.f),st:ST.flash[chaveTxtCache(c)]}))
    .filter(x=>!x.st||x.st.due<=hj);
}
const _ctc={};function chaveTxtCache(c){return _ctc[c.f]||(_ctc[c.f]=chaveTxt(c.f))}
function montaCartoes(){
  const sec=$("#sec-cartoes");
  const fila=cartoesDeHoje();
  if(!fila.length){
    const prox=Object.values(ST.flash).map(s=>s.due).sort()[0];
    sec.innerHTML=`<div class="cartao flash"><div class="frente">Nenhum cartão para hoje.</div>
      <div class="mut peq">${FLASH.length} cartões no total${prox?`, próxima revisão em ${esc(prox)}`:""}</div></div>`;
    return;
  }
  const x=fila[0],c=x.c;
  sec.innerHTML=`<div class="cartao">
    <div class="linha peq mut" style="justify-content:space-between">
      ${chipTema(c.tema||"fisica")}<span>${fila.length} para hoje</span></div>
    <div class="flash">
      <div class="frente">${esc(c.f)}</div>
      <div class="verso" id="fcVerso" hidden>${esc(c.v)}</div>
      <button class="btn" id="fcMostra">Mostrar resposta</button>
      <div class="linha" id="fcNotas" hidden>
        <button class="btn perigo" data-n="1">Errei</button>
        <button class="btn fant" data-n="3">Difícil</button>
        <button class="btn fant" data-n="4">Bom</button>
        <button class="btn" data-n="5">Fácil</button>
      </div>
    </div></div>`;
  $("#fcMostra").onclick=()=>{$("#fcVerso").hidden=false;$("#fcMostra").hidden=true;$("#fcNotas").hidden=false};
  sec.querySelectorAll("#fcNotas button").forEach(b=>b.onclick=()=>{
    const ch=chaveTxtCache(c);
    ST.flash[ch]=sm2(ST.flash[ch]||{},+b.dataset.n);
    ARM.save("rt_flash",ST.flash); atividade(1); montaCartoes();
  });
}

      <tr><td>Banco</td><td>${BANCO.length} questões • ${FLASH.length} cartões • ${CASOS.length} casos de imagem</td></tr>
      <tr><td>Edital de referência</td><td><a href="docs/normativa-cbr-2026-edital-1909.pdf" target="_blank" rel="noopener">Edital 1909, CBR/AMB 2026</a></td></tr>
    </table>
    <div class="linha" style="margin-top:10px">
      <button class="btn fant" id="ajAtualiza">Buscar atualização</button>
    </div>
  </div>`;
  if(window.RTSYNC)RTSYNC.renderCartao($("#slotSync"));
  $("#ajAtualiza").onclick=async()=>{
    try{
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.update()));
      UI.banner("info","Verificação de atualização disparada, recarregando…");
      setTimeout(()=>location.reload(),800);
    }catch(e){location.reload()}
  };
}

/* ---------- util ---------- */
function baixaArquivo(nome,conteudo,tipo){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([conteudo],{type:tipo}));
  a.download=nome;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
function abreLuz(src){$("#luzFrame").src=src;$("#luz").classList.add("on")}
$("#luzFecha").onclick=()=>{$("#luz").classList.remove("on");$("#luzFrame").src="about:blank"};
$("#btGaleria").onclick=()=>montaImagens("galeria");
$("#btTreino").onclick=()=>montaImagens("treino");

/* ---------- boot ---------- */
(async function boot(){
  await ARM.boot();
  carregaEstado();
  montaAbas();
  $("#subTopo").textContent=`v${V} • ${BANCO.length} questões • ${CASOS.length} casos`;
  if(ARM.persistOK===false)console.warn("storage.persist() negado — comum no iOS; espelho IDB ativo.");
  if(ST.simativo&&!ST.simativo.fim)UI.banner("info","Há um simulado em andamento: retome na aba Simulado.");
  const h=location.hash.slice(1);
  irAba(ABAS.some(a=>a[0]===h)?h:(ST.pos.aba&&ABAS.some(a=>a[0]===ST.pos.aba)?ST.pos.aba:"questoes"),false);
  if("serviceWorker" in navigator){try{navigator.serviceWorker.register("sw.js")}catch(e){}}
  ARM.snapshot("boot");
  window.__rtPronto=true;window.dispatchEvent(new Event("rt-pronto"));
})();

/* ganchos de teste (verificação por DOM) */
window.__rt={get ST(){return ST},ARM,chaveQ,chaveTxt,QIDX,irAba,registraResposta,V};
